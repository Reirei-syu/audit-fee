<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审计费计算器 Pro - ISO 稳定版</title>
    
    <!-- 1. 样式库：Tailwind CSS (UI框架，锁定主要版本) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- 2. 图标库：Lucide (图标资源，锁定版本) -->
    <script src="https://unpkg.com/lucide@0.577.0/dist/umd/lucide.min.js"></script>

    <!-- 3. 核心框架：React 18 UMD (通用模块定义，最稳定的浏览器直接运行方式) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 4. 编译器：Babel Standalone (用于在浏览器中将 JSX 转换为 JS，锁定版本) -->
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

    <!-- 5. 导出库：SheetJS (用于导出 Excel，锁定版本) -->
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1d1d1f;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            width: min(95vw, 1200px);
            max-width: 1200px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .iso-card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .iso-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(120deg, #1ed6ff, #5b7dff, #1ed6ff);
            background-size: 200% 200%;
            opacity: 0;
            pointer-events: none;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            transition: opacity 0.2s ease;
        }

        .iso-card:hover::before {
            opacity: 1;
            animation: isoBorderFlow 1.6s linear infinite;
        }

        .iso-hover-outline {
            position: relative;
        }

        .iso-hover-outline::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(120deg, #1ed6ff, #5b7dff, #1ed6ff);
            background-size: 200% 200%;
            opacity: 0;
            pointer-events: none;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            transition: opacity 0.2s ease;
        }

        .iso-hover-outline:hover::after {
            opacity: 1;
            animation: isoBorderFlow 1.6s linear infinite;
        }

        @keyframes isoBorderFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .iso-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 16px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .iso-input:focus {
            border-color: #007aff;
            ring: 2px solid rgba(0, 122, 255, 0.1);
        }

        .iso-button {
            background: #007aff;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .iso-button:hover {
            background: #0062cc;
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.4);
        }

        .iso-button-secondary {
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .iso-button-secondary:hover {
            background: rgba(0, 122, 255, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #007aff, #5856d6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Batch Header Adaptive Scaling */
        .batch-controls {
            transform-origin: right center;
        }
        @media (max-width: 1024px) {
            .batch-controls { transform: scale(0.95); }
        }
        @media (max-width: 768px) {
            .batch-controls { transform: scale(0.9); }
        }
        @media (max-width: 640px) {
            .batch-controls { transform: scale(0.85); }
        }
        
        /* Loading / Error State */
        #loading-state {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            background: #f5f7fa; color: #666; font-size: 1.2rem;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- Loading Indicator (Removes automatically when React mounts) -->
    <div id="loading-state">正在加载资源，请稍候...</div>
    
    <!-- App Root -->
    <div id="root"></div>

    <!-- Error Handler -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const loader = document.getElementById('loading-state');
            if(loader) {
                loader.innerHTML = `
                    <div style="text-align:center; color:#ef4444; padding:20px;">
                        <h3 style="font-weight:bold; margin-bottom:10px;">启动失败</h3>
                        <p style="font-size:0.9rem;">${msg}</p>
                        <p style="font-size:0.8rem; margin-top:10px; color:#999;">请确保网络连接正常 (需要访问 unpkg.com)</p>
                    </div>
                `;
            }
        };
    </script>

    <script type="text/babel">
        // Access React from global UMD scope
        const { useState, useEffect, useMemo, useRef } = React;
        const { createRoot } = ReactDOM;

        // --- Data Standards ---
        const DEFAULT_STANDARDS = [
            {
                id: 'annual',
                name: '会计年报审计',
                basis: '资产总额',
                tiers: [
                    { limit: 100, fee: 4000 },
                    { limit: 400, fee: 6000 },
                    { limit: 1000, fee: 8000 },
                    { limit: 5000, fee: 15000 },
                    { limit: Infinity, base: 15000, threshold: 5000, rate: 0.2 } // rate in ‰
                ]
            },
            {
                id: 'responsibility',
                name: '任期经济责任审计',
                basis: '资产总额/年',
                tiers: [
                    { limit: 100, fee: 6000 },
                    { limit: 400, fee: 8000 },
                    { limit: 1000, fee: 10000 },
                    { limit: 5000, fee: 20000 },
                    { limit: Infinity, base: 20000, threshold: 5000, rate: 0.2 }
                ]
            },
            {
                id: 'liquidation',
                name: '清产核资审计',
                basis: '资产总额',
                tiers: [
                    { limit: 100, fee: 6000 },
                    { limit: 400, fee: 8000 },
                    { limit: 1000, fee: 10000 },
                    { limit: 5000, fee: 20000 },
                    { limit: Infinity, base: 20000, threshold: 5000, rate: 0.2 }
                ]
            },
            {
                id: 'project',
                name: '工程竣工决算审计',
                basis: '投资总额',
                tiers: [
                    { limit: 100, fee: 10000 },
                    { limit: 400, fee: 20000 },
                    { limit: 1000, fee: 50000 },
                    { limit: Infinity, base: 50000, threshold: 1000, rate: 0.2 }
                ]
            },
            {
                id: 'special',
                name: '专项资金审计',
                basis: '专项金额',
                tiers: [
                    { limit: 100, fee: 10000 },
                    { limit: 400, fee: 30000 },
                    { limit: 1000, fee: 50000 },
                    { limit: Infinity, base: 50000, threshold: 1000, rate: 0.2 }
                ]
            }
        ];

        // --- Core Utilities ---
        const STANDARDS_STORAGE_KEY = 'audit_standards_v2';
        const STANDARDS_STORAGE_VERSION = 1;

        const normalizeNumberString = (value) => {
            if (value === null || value === undefined) return '';
            if (typeof value === 'number') return String(value);
            return String(value).replace(/[,，\s]/g, '');
        };

        const parseNumber = (value) => {
            const normalized = normalizeNumberString(value);
            const num = parseFloat(normalized);
            return Number.isFinite(num) ? num : NaN;
        };

        const sanitizeStandards = (raw) => {
            if (!Array.isArray(raw)) return null;
            const cleaned = [];
            for (const item of raw) {
                if (!item || typeof item !== 'object') continue;
                const id = String(item.id || '').trim();
                const name = String(item.name || '').trim();
                const basis = String(item.basis || '').trim();
                if (!id || !name || !basis) continue;
                if (!Array.isArray(item.tiers) || item.tiers.length === 0) continue;

                let tiers = [];
                for (const tier of item.tiers) {
                    if (!tier || typeof tier !== 'object') continue;
                    const limitRaw = tier.limit;
                    const limit = (limitRaw === Infinity) ? Infinity : parseNumber(limitRaw);
                    if (limit !== Infinity && !Number.isFinite(limit)) continue;

                    if (limit === Infinity) {
                        const rate = parseNumber(tier.rate);
                        if (!Number.isFinite(rate) || rate < 0) continue;
                        let threshold = parseNumber(tier.threshold);
                        if (!Number.isFinite(threshold) || threshold < 0) threshold = NaN;
                        tiers.push({ limit: Infinity, rate, threshold });
                    } else {
                        if (limit < 0) continue;
                        const fee = parseNumber(tier.fee);
                        if (!Number.isFinite(fee) || fee < 0) continue;
                        tiers.push({ limit, fee });
                    }
                }

                if (tiers.length === 0) continue;
                tiers.sort((a, b) => {
                    const la = a.limit === Infinity ? Number.MAX_SAFE_INTEGER : a.limit;
                    const lb = b.limit === Infinity ? Number.MAX_SAFE_INTEGER : b.limit;
                    return la - lb;
                });

                const infinityIndex = tiers.findIndex(t => t.limit === Infinity);
                if (infinityIndex === -1) continue;
                if (infinityIndex !== tiers.length - 1) {
                    const infTier = tiers[infinityIndex];
                    tiers = tiers.filter(t => t.limit !== Infinity);
                    tiers.push(infTier);
                }

                const lastFinite = tiers.length > 1 ? tiers[tiers.length - 2] : null;
                const infTier = tiers[tiers.length - 1];
                if (!Number.isFinite(infTier.threshold) || infTier.threshold < 0) {
                    infTier.threshold = lastFinite ? lastFinite.limit : 0;
                }

                cleaned.push({ id, name, basis, tiers });
            }
            return cleaned.length ? cleaned : null;
        };

        const getTierBase = (standard, infinityIndex) => {
            let total = 0;
            for (let i = 0; i < infinityIndex; i++) {
                const tier = standard.tiers[i];
                if (tier && Number.isFinite(tier.fee)) {
                    total += tier.fee;
                }
            }
            return total;
        };

        const loadStandardsFromStorage = () => {
            try {
                const saved = localStorage.getItem(STANDARDS_STORAGE_KEY);
                if (!saved) return null;
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) {
                    const sanitized = sanitizeStandards(parsed);
                    if (!sanitized) localStorage.removeItem(STANDARDS_STORAGE_KEY);
                    return sanitized;
                }
                if (parsed && typeof parsed === 'object') {
                    if (parsed.version !== STANDARDS_STORAGE_VERSION) return null;
                    const sanitized = sanitizeStandards(parsed.standards);
                    if (!sanitized) localStorage.removeItem(STANDARDS_STORAGE_KEY);
                    return sanitized;
                }
                localStorage.removeItem(STANDARDS_STORAGE_KEY);
                return null;
            } catch (e) {
                return null;
            }
        };

        // --- Core Calculator ---
        const calculateFee = (assetValue, standard, unit = 'wan', method = 'excess') => {
            let val = parseNumber(assetValue);
            if (!val || isNaN(val) || val <= 0) return 0;
            
            // Convert to 'wan' for calculation if input is in 'yuan'
            if (unit === 'yuan') {
                val = val / 10000;
            }
            
            let totalFee = 0;
            const tiers = standard.tiers;
            
            for (let i = 0; i < tiers.length; i++) {
                const tier = tiers[i];
                const prevLimit = i === 0 ? 0 : tiers[i-1].limit;
                
                // Handle Infinity Tier (Rate-based)
                if (tier.limit === Infinity) {
                    // Logic: Base (sum of previous tiers) + (Excess * Rate)
                    // Rate is in ‰ (e.g. 0.2), so * 10 for Wan->Yuan conversion.
                    const excess = val - tier.threshold;
                    const base = getTierBase(standard, i);
                    return base + (excess * tier.rate * 10);
                }

                // Normal Tier Handling
                if (val > tier.limit) {
                    // If we exceeded this tier, we pay its full "Standard Value" (Fee)
                    // regardless of method (Excess vs Full) because we've passed it.
                    if (tier.fee !== undefined) {
                        totalFee += tier.fee;
                    }
                } else {
                    // We are WITHIN this tier
                    
                    // Tier 0 is treated as a Flat Minimum Charge in this context
                    // "100万以下按4000元" implies a floor, not linear 0-4000.
                    if (i === 0) {
                        return tier.fee;
                    }

                    if (method === 'full') {
                        // Full Progressive (User Def): "Sum of this tier and all previous"
                        // Since we already added previous tiers in the loop, just add this one.
                        return totalFee + tier.fee;
                    } else {
                        // Excess Progressive (User Def): Linear Interpolation for the interval
                        // "(Excess / Range) * Fee"
                        const range = tier.limit - prevLimit;
                        const excessInTier = val - prevLimit;
                        const fraction = excessInTier / range;
                        return totalFee + (fraction * tier.fee);
                    }
                }
            }
            
            return totalFee;
        };

        // --- Components ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({
                        attrs: {
                            class: className,
                            style: `width: ${size}px; height: ${size}px;`
                        },
                        name: name,
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name, size, className]);
            return <i data-lucide={name} ref={iconRef} className={className}></i>;
        };
        
        const ToggleGroup = ({ options, value, onChange }) => (
            <div className="bg-white/50 p-1 rounded-xl flex border border-white/40 shadow-sm">
                {options.map(opt => (
                    <button 
                        key={opt.value}
                        onClick={() => onChange(opt.value)}
                        className={`iso-hover-outline px-4 py-2 rounded-lg text-sm font-semibold transition-all ${value === opt.value ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:bg-white/30'}`}
                    >
                        {opt.label}
                    </button>
                ))}
            </div>
        );

        // --- Batch Calculator Component ---
        const BatchCalc = ({ standards, unit, calcMethod, setCalcMethod }) => {
            // Rows: { id, name, amount, typeId, fee }
            const [rows, setRows] = useState(() => {
                // Initial 10 empty rows
                return Array(10).fill(0).map((_, i) => ({
                    id: Date.now() + i,
                    name: '',
                    amount: '',
                    typeId: standards[0].id,
                    fee: null
                }));
            });
            const [globalType, setGlobalType] = useState(standards[0].id);
            const [batchDiscount, setBatchDiscount] = useState(100);

            // Trigger Calculation for all rows
            const handleBatchCalculate = () => {
                const updatedRows = rows.map(row => {
                    const std = standards.find(s => s.id === row.typeId);
                    if (!std || !row.amount) {
                        return { ...row, fee: 0 };
                    }
                    const baseFee = calculateFee(row.amount, std, unit, calcMethod);
                    const finalFee = baseFee * (batchDiscount / 100);
                    return { ...row, fee: finalFee };
                });
                setRows(updatedRows);
            };

            const handleExport = async () => {
                if (!window.XLSX) {
                    alert('导出模块加载失败，请检查网络连接后重试。');
                    return;
                }
                const exportRows = rows.filter(r => Number.isFinite(r.fee) && r.fee > 0);
                if (exportRows.length === 0) {
                    alert('暂无可导出的有效数据（折后费用需大于0）。');
                    return;
                }

                const methodLabel = calcMethod === 'full' ? '全额累进' : '超额累进';
                const amountHeader = `资产/标的额 (${unit === 'wan' ? '万元' : '元'})`;
                const headers = [
                    '序号',
                    '单位/项目名称',
                    amountHeader,
                    '业务类型',
                    '折扣率(%)',
                    '计费方式',
                    '折后费用 (元)'
                ];

                const data = exportRows.map((row, idx) => {
                    const std = standards.find(s => s.id === row.typeId);
                    return {
                        '序号': idx + 1,
                        '单位/项目名称': row.name || '',
                        [amountHeader]: row.amount || '',
                        '业务类型': std ? std.name : '',
                        '折扣率(%)': batchDiscount,
                        '计费方式': methodLabel,
                        '折后费用 (元)': Number(row.fee.toFixed(2))
                    };
                });

                const sheet = window.XLSX.utils.json_to_sheet(data, { header: headers });

                const colWidths = headers.map((key) => {
                    let maxLen = String(key).length;
                    for (const row of data) {
                        const val = row[key];
                        const len = String(val ?? '').length;
                        if (len > maxLen) maxLen = len;
                    }
                    return { wch: Math.min(Math.max(maxLen + 2, 8), 40) };
                });
                sheet['!cols'] = colWidths;

                const workbook = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(workbook, sheet, '批量计算');

                const now = new Date();
                const pad = (n) => String(n).padStart(2, '0');
                const filename = `audit-fee-batch-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}.xlsx`;

                const fileData = window.XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
                if (window.showSaveFilePicker) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: filename,
                            types: [{
                                description: 'Excel 文件',
                                accept: {
                                    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx']
                                }
                            }]
                        });
                        const writable = await handle.createWritable();
                        await writable.write(fileData);
                        await writable.close();
                        return;
                    } catch (err) {
                        if (err && err.name === 'AbortError') return;
                        console.warn('另存为失败，回退到自动下载：', err);
                    }
                }

                window.XLSX.writeFile(workbook, filename);
            };

            const updateRow = (index, field, value) => {
                const newRows = [...rows];
                let nextValue = value;
                if (field === 'amount') {
                    const normalized = normalizeNumberString(value);
                    if (normalized !== '' && !/^\d*\.?\d*$/.test(normalized)) {
                        return;
                    }
                    nextValue = normalized;
                }
                // Reset fee on edit to indicate need for recalculation
                newRows[index] = { ...newRows[index], [field]: nextValue, fee: null };
                setRows(newRows);
            };
            
            // ... (rest of row management logic: addRow, clearRows, handlePaste) ...
            const addRow = () => {
                setRows([...rows, { id: Date.now(), name: '', amount: '', typeId: globalType, fee: null }]);
            };
            
            const clearRows = () => {
                if(confirm("确定清空所有数据吗？")) {
                    setRows(Array(10).fill(0).map((_, i) => ({
                        id: Date.now() + i,
                        name: '',
                        amount: '',
                        typeId: globalType,
                        fee: null
                    })));
                }
            };

            // Excel-like Paste Handler
            const handlePaste = (e, startIndex, colType) => {
                e.preventDefault();
                const clipboardData = e.clipboardData || window.clipboardData;
                const pastedData = clipboardData.getData('Text');
                
                const lines = pastedData.split(/\r\n|\n/).filter(line => line.trim() !== '');
                
                const newRows = [...rows];
                
                lines.forEach((line, i) => {
                    const currentRowIdx = startIndex + i;
                    
                    // Auto-expand rows if pasted data exceeds current length
                    if (currentRowIdx >= newRows.length) {
                        newRows.push({ id: Date.now() + i, name: '', amount: '', typeId: globalType, fee: null });
                    }
                    
                    const cells = line.split('\t');
                    
                    if (colType === 'name') {
                        // Pasting into Name column
                        newRows[currentRowIdx].name = cells[0] || '';
                        if (cells[1]) {
                            // If there is a second column, assume it's amount
                            const normalized = normalizeNumberString(cells[1].trim());
                            if (normalized === '' || /^\d*\.?\d*$/.test(normalized)) {
                                newRows[currentRowIdx].amount = normalized;
                            }
                        }
                    } else if (colType === 'amount') {
                        // Pasting into Amount column
                        // Take the first valid number-like cell
                        const val = cells.find(c => /^\d/.test(c.trim()));
                        if (val) {
                            const normalized = normalizeNumberString(val.trim());
                            if (normalized === '' || /^\d*\.?\d*$/.test(normalized)) {
                                newRows[currentRowIdx].amount = normalized;
                            }
                        }
                    }
                    // Reset fee for pasted rows
                    newRows[currentRowIdx].fee = null;
                });
                
                setRows(newRows);
            };

            // Batch set type
            const applyGlobalType = (typeId) => {
                setGlobalType(typeId);
                const newRows = rows.map(r => ({ ...r, typeId, fee: null }));
                setRows(newRows);
            };
            
            const totalFee = rows.reduce((acc, row) => acc + (row.fee || 0), 0);

            return (
                <div className="space-y-6 animate-in slide-in-from-right duration-500">
                    <header className="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
                        <div className="flex-shrink-0">
                            <h1 className="text-2xl font-bold tracking-tight">批量计算</h1>
                        </div>
                        <div className="batch-controls flex flex-wrap items-center gap-3 w-full xl:w-auto xl:justify-end">
                            <ToggleGroup 
                                options={[{label: '超额累进', value: 'excess'}, {label: '全额累进', value: 'full'}]}
                                value={calcMethod}
                                onChange={setCalcMethod}
                            />
                            <div className="iso-hover-outline flex items-center bg-white/50 rounded-lg px-3 py-2 border border-blue-100 shadow-sm">
                                <span className="text-sm text-gray-600 font-medium mr-2">批量折扣(%):</span>
                                <input 
                                    type="number" 
                                    min="0" 
                                    max="100" 
                                    value={batchDiscount}
                                    onChange={(e) => {
                                        const next = parseFloat(e.target.value);
                                        const safe = Number.isFinite(next) ? next : 0;
                                        setBatchDiscount(Math.min(100, Math.max(0, safe)));
                                    }}
                                    className="w-16 bg-transparent text-right font-bold text-blue-600 outline-none border-b border-blue-200 focus:border-blue-500"
                                />
                            </div>
                            <button 
                                onClick={handleBatchCalculate} 
                                className="px-6 py-2 text-sm font-bold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/30 flex items-center gap-2"
                            >
                                <Icon name="calculator" size={16} /> 开始计算
                            </button>
                            <button 
                                onClick={handleExport} 
                                className="px-6 py-2 text-sm font-bold text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors border border-blue-100 flex items-center gap-2"
                            >
                                <Icon name="download" size={16} /> 导出 Excel
                            </button>
                             <button onClick={clearRows} className="px-4 py-2 text-sm text-red-500 bg-red-50 rounded-lg hover:bg-red-100 transition-colors">
                                清空
                            </button>
                            <div className="bg-blue-50 px-4 py-2 rounded-lg border border-blue-100">
                                <span className="text-xs text-blue-500 font-bold uppercase">总计费用</span>
                                <div className="text-xl font-bold text-blue-700">
                                    {new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' }).format(totalFee)}
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="iso-card overflow-hidden">
                        <div className="bg-white/60 p-3 border-b border-white/40 grid grid-cols-12 gap-4 text-sm font-semibold text-gray-500 items-center">
                            <div className="col-span-1 text-center">序号</div>
                            <div className="col-span-3">单位/项目名称</div>
                            <div className="col-span-3">
                                {unit === 'wan' ? '资产/标的额 (万元)' : '资产/标的额 (元)'}
                            </div>
                            <div className="col-span-3">
                                <select 
                                    value={globalType} 
                                    onChange={(e) => applyGlobalType(e.target.value)}
                                    className="w-full bg-transparent border-b border-dashed border-gray-300 focus:border-blue-500 outline-none py-1 text-blue-600"
                                >
                                    {standards.map(s => <option key={s.id} value={s.id}>批量设为: {s.name}</option>)}
                                </select>
                            </div>
                            <div className="col-span-2 text-right pr-4">折后费用 (元)</div>
                        </div>
                        
                        <div className="max-h-[60vh] overflow-y-auto custom-scrollbar bg-white/30">
                            {rows.map((row, idx) => (
                                <div key={row.id} className="grid grid-cols-12 gap-4 p-2 border-b border-white/20 items-center hover:bg-white/50 transition-colors">
                                    <div className="col-span-1 text-center text-gray-400 text-xs">{idx + 1}</div>
                                    <div className="col-span-3">
                                        <input 
                                            type="text" 
                                            value={row.name}
                                            onChange={(e) => updateRow(idx, 'name', e.target.value)}
                                            onPaste={(e) => handlePaste(e, idx, 'name')}
                                            placeholder="粘贴名称"
                                            className="w-full bg-transparent border-b border-transparent focus:border-blue-300 outline-none px-2 py-1"
                                        />
                                    </div>
                                    <div className="col-span-3">
                                        <input 
                                            type="text" 
                                            value={row.amount}
                                            onChange={(e) => updateRow(idx, 'amount', e.target.value)}
                                            onPaste={(e) => handlePaste(e, idx, 'amount')}
                                            placeholder="0.00"
                                            className="w-full bg-transparent border-b border-transparent focus:border-blue-300 outline-none px-2 py-1 font-mono"
                                        />
                                    </div>
                                    <div className="col-span-3">
                                        <select 
                                            value={row.typeId}
                                            onChange={(e) => updateRow(idx, 'typeId', e.target.value)}
                                            className="w-full bg-transparent outline-none text-sm text-gray-700"
                                        >
                                            {standards.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="col-span-2 text-right pr-4 font-mono font-medium text-gray-800">
                                        {row.fee !== null ? row.fee.toFixed(2) : <span className="text-gray-400 text-xs">待计算</span>}
                                    </div>
                                </div>
                            ))}
                            <button 
                                onClick={addRow}
                                className="w-full py-3 text-sm text-gray-400 hover:bg-white/40 hover:text-blue-500 transition-colors flex items-center justify-center gap-2"
                            >
                                <Icon name="plus" size={14} /> 添加一行
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Tooltip = ({ text, children }) => {
            return (
                <div className="group relative flex items-center">
                    {children}
                    <div className="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-opacity whitespace-nowrap pointer-events-none z-50">
                        {text}
                        <div className="absolute left-0 top-1/2 -translate-x-1 -translate-y-1/2 border-4 border-transparent border-r-gray-800"></div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('calc'); // 'calc', 'settings', 'batch'
            const [unit, setUnit] = useState('wan'); // 'wan', 'yuan'
            const [calcMethod, setCalcMethod] = useState('excess'); // 'excess', 'full'
            const [standards, setStandards] = useState(() => {
                const loaded = loadStandardsFromStorage();
                return loaded || DEFAULT_STANDARDS;
            });
            
            const [asset, setAsset] = useState('');
            const [selectedType, setSelectedType] = useState(standards[0].id);
            const [discount, setDiscount] = useState(100);
            const [years, setYears] = useState(1);

            useEffect(() => {
                try {
                    const payload = {
                        version: STANDARDS_STORAGE_VERSION,
                        standards
                    };
                    localStorage.setItem(STANDARDS_STORAGE_KEY, JSON.stringify(payload));
                } catch (e) {
                    // Ignore write errors (quota/privacy mode)
                }
            }, [standards]);

            useEffect(() => {
                if (!standards.find(s => s.id === selectedType)) {
                    setSelectedType(standards[0]?.id || DEFAULT_STANDARDS[0].id);
                }
            }, [standards, selectedType]);

            useEffect(() => {
                const loader = document.getElementById('loading-state');
                if(loader) loader.style.display = 'none';
            }, []);

            const currentStandard = useMemo(() => 
                standards.find(s => s.id === selectedType) || standards[0], 
            [selectedType, standards]);

            const rawFee = useMemo(() => {
                const f = calculateFee(asset, currentStandard, unit, calcMethod);
                return selectedType === 'responsibility' ? f * years : f;
            }, [asset, currentStandard, selectedType, years, unit, calcMethod]);

            const finalFee = (rawFee * discount / 100);

            const formatCurrency = (val) => {
                return new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' }).format(val);
            };

            const handleAssetChange = (v) => {
                const normalized = normalizeNumberString(v);
                if (normalized === '' || /^\d*\.?\d*$/.test(normalized)) {
                    setAsset(normalized);
                }
            };

            const resetStandards = () => {
                if (confirm('确定要恢复默认收费标准吗？')) {
                    setStandards(DEFAULT_STANDARDS);
                }
            };

            return (
                <div className="glass-container flex flex-col md:flex-row min-h-[600px]">
                    {/* Sidebar / Navigation */}
                    <div className="w-full md:w-20 bg-white/30 backdrop-blur-md flex md:flex-col items-center justify-between md:justify-start p-4 md:pt-10 gap-8 border-b md:border-b-0 md:border-r border-white/20">
                        <div className="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 text-white mb-4">
                            <Icon name="calculator" size={24} />
                        </div>
                        
                        <Tooltip text="单项计算">
                            <button 
                                onClick={() => setView('calc')}
                                className={`p-3 rounded-xl transition-all ${view === 'calc' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-500 hover:bg-white/50'}`}
                            >
                                <Icon name="layout-dashboard" size={20} />
                            </button>
                        </Tooltip>

                        <Tooltip text="批量计算">
                            <button 
                                onClick={() => setView('batch')}
                                className={`p-3 rounded-xl transition-all ${view === 'batch' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-500 hover:bg-white/50'}`}
                            >
                                <Icon name="table" size={20} />
                            </button>
                        </Tooltip>

                        <Tooltip text="标准维护">
                            <button 
                                onClick={() => setView('settings')}
                                className={`p-3 rounded-xl transition-all ${view === 'settings' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-500 hover:bg-white/50'}`}
                            >
                                <Icon name="settings" size={20} />
                            </button>
                        </Tooltip>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 p-6 md:p-10 overflow-y-auto max-h-screen">
                        {view === 'batch' ? (
                            <BatchCalc 
                                standards={standards} 
                                unit={unit} 
                                calcMethod={calcMethod}
                                setCalcMethod={setCalcMethod}
                            />
                        ) : view === 'calc' ? (
                            <div className="space-y-10 animate-in fade-in duration-500">
                                <header className="flex justify-between items-start">
                                    <div>
                                        <h1 className="text-3xl font-bold tracking-tight">审计费计算器 Pro</h1>
                                        <p className="text-gray-500 mt-2 text-lg">快速、精确、稳定</p>
                                    </div>
                                    <div className="flex gap-4">
                                        <ToggleGroup 
                                            options={[{label: '超额累进', value: 'excess'}, {label: '全额累进', value: 'full'}]}
                                            value={calcMethod}
                                            onChange={setCalcMethod}
                                        />
                                        <ToggleGroup 
                                            options={[{label: '万元', value: 'wan'}, {label: '元', value: 'yuan'}]}
                                            value={unit}
                                            onChange={setUnit}
                                        />
                                    </div>
                                </header>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                    {/* Inputs */}
                                    <div className="space-y-6">
                                        <div className="iso-card p-6 space-y-4">
                                            <label className="text-sm font-semibold text-gray-500 flex items-center gap-2">
                                                <Icon name="briefcase" size={14} /> 业务类别
                                            </label>
                                            <select 
                                                value={selectedType}
                                                onChange={(e) => setSelectedType(e.target.value)}
                                                className="iso-input bg-white"
                                            >
                                                {standards.map(s => (
                                                    <option key={s.id} value={s.id}>{s.name}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="iso-card p-6 space-y-4">
                                            <div className="flex justify-between">
                                                <label className="text-sm font-semibold text-gray-500 flex items-center gap-2">
                                                    <Icon name="database" size={14} /> 
                                                    {currentStandard.basis} ({unit === 'wan' ? '万元' : '元'})
                                                </label>
                                            </div>
                                            <input 
                                                type="text"
                                                inputMode="decimal"
                                                placeholder="请输入金额"
                                                value={asset}
                                                onChange={(e) => handleAssetChange(e.target.value)}
                                                className="iso-input text-2xl font-semibold"
                                            />
                                            <div className="flex justify-between text-xs text-gray-400 font-medium">
                                                <span>基准说明：{unit === 'wan' ? '100 万 = 1,000,000 元' : '直接输入元'}</span>
                                                <span className="text-blue-500">
                                                    当前识别：
                                                    {unit === 'wan' 
                                                        ? (parseFloat(asset) * 10000 || 0).toLocaleString() 
                                                        : (parseFloat(asset) || 0).toLocaleString()
                                                    } 元
                                                </span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="iso-card p-6 space-y-4">
                                                <label className="text-sm font-semibold text-gray-500 flex items-center gap-2">
                                                    <Icon name="percent" size={14} /> 折扣率 (%)
                                                </label>
                                                <input 
                                                    type="number"
                                                    value={discount}
                                                    onChange={(e) => {
                                                        const next = parseFloat(e.target.value);
                                                        const safe = Number.isFinite(next) ? next : 0;
                                                        setDiscount(Math.min(100, Math.max(0, safe)));
                                                    }}
                                                    className="iso-input"
                                                />
                                            </div>
                                            {selectedType === 'responsibility' && (
                                                <div className="iso-card p-6 space-y-4">
                                                    <label className="text-sm font-semibold text-gray-500 flex items-center gap-2">
                                                        <Icon name="calendar" size={14} /> 审计年限
                                                    </label>
                                                    <input 
                                                        type="number"
                                                        value={years}
                                                        onChange={(e) => {
                                                            const next = parseInt(e.target.value, 10);
                                                            const safe = Number.isFinite(next) ? next : 1;
                                                            setYears(Math.max(1, safe));
                                                        }}
                                                        className="iso-input"
                                                    />
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Results */}
                                    <div className="flex flex-col gap-6">
                                        <div className="iso-card p-8 flex flex-col items-center justify-center text-center space-y-6 bg-blue-50/50 border-blue-200/50 flex-1">
                                            <span className="text-sm font-bold text-blue-600 uppercase tracking-widest">计算结果</span>
                                            <div className="result-value animate-in zoom-in duration-300">
                                                {formatCurrency(finalFee)}
                                            </div>
                                            <div className="w-full h-px bg-blue-200/50"></div>
                                            <div className="grid grid-cols-2 w-full gap-4 text-sm">
                                                <div className="text-left">
                                                    <p className="text-gray-400">原始基准价</p>
                                                    <p className="font-semibold">{formatCurrency(rawFee)}</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-gray-400">优惠金额</p>
                                                    <p className="font-semibold text-emerald-600">-{formatCurrency(rawFee - finalFee)}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white/40 p-5 rounded-2xl text-xs text-gray-500 leading-relaxed border border-white/20">
                                            <p className="font-bold mb-1">💡 计费说明：</p>
                                            <p>依据所选业务类型及资产基数，系统自动匹配对应阶梯。超过最高阈值部分采用超额累进方式计算（费率：{currentStandard.tiers[currentStandard.tiers.length - 1].rate}‰）。</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-8 animate-in slide-in-from-bottom duration-500">
                                <header className="flex items-center justify-between">
                                    <div>
                                        <h1 className="text-3xl font-bold tracking-tight">维护收费标准</h1>
                                        <p className="text-gray-500 mt-2 text-lg">点击相应数值进行修改</p>
                                    </div>
                                    <button 
                                        onClick={resetStandards}
                                        className="iso-button-secondary text-red-500 hover:bg-red-50"
                                    >
                                        恢复默认
                                    </button>
                                </header>

                                <div className="space-y-6">
                                    {standards.map((std, sIdx) => (
                                        <div key={std.id} className="iso-card overflow-hidden">
                                            <div className="bg-white/60 p-4 border-b border-white/40 flex justify-between items-center">
                                                <span className="font-bold text-lg">{std.name}</span>
                                                <span className="text-xs text-gray-400">依据：{std.basis}</span>
                                            </div>
                                            <div className="p-6 overflow-x-auto">
                                                <table className="w-full text-sm">
                                                    <thead>
                                                        <tr className="text-gray-400 border-b border-gray-100">
                                                            <th className="pb-3 font-medium text-left">分段阈值 (万元)</th>
                                                            <th className="pb-3 font-medium text-left">固定金额 / 累进费率</th>
                                                            <th className="pb-3 font-medium text-left">说明</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-gray-50">
                                                        {std.tiers.map((tier, tIdx) => (
                                                            <tr key={tIdx} className="hover:bg-white/30 transition-colors">
                                                                <td className="py-4">
                                                                    {tier.limit === Infinity ? (
                                                                        <span className="text-blue-600 font-bold">>{std.tiers[tIdx-1]?.limit} 以上</span>
                                                                    ) : (
                                                                        <div className="flex items-center gap-2">
                                                                            <span>≤</span>
                                                                            <input 
                                                                                type="number"
                                                                                value={tier.limit}
                                                                                onChange={(e) => {
                                                                                    const newStds = [...standards];
                                                                                const next = parseFloat(e.target.value);
                                                                                if (!Number.isFinite(next)) return;
                                                                                newStds[sIdx].tiers[tIdx].limit = Math.max(0, next);
                                                                                // Sync threshold for the next infinite tier if it exists
                                                                                if (newStds[sIdx].tiers[tIdx+1]?.limit === Infinity) {
                                                                                    newStds[sIdx].tiers[tIdx+1].threshold = Math.max(0, next);
                                                                                }
                                                                                setStandards(newStds);
                                                                            }}
                                                                                className="w-24 bg-transparent border-b border-blue-200 focus:border-blue-500 outline-none px-1"
                                                                            />
                                                                        </div>
                                                                    )}
                                                                </td>
                                                                <td className="py-4">
                                                                    {tier.fee !== undefined ? (
                                                                        <input 
                                                                            type="number"
                                                                            value={tier.fee}
                                                                            onChange={(e) => {
                                                                                const newStds = [...standards];
                                                                                const next = parseFloat(e.target.value);
                                                                                if (!Number.isFinite(next)) return;
                                                                                newStds[sIdx].tiers[tIdx].fee = Math.max(0, next);
                                                                                setStandards(newStds);
                                                                            }}
                                                                            className="w-24 bg-transparent border-b border-blue-200 focus:border-blue-500 outline-none px-1"
                                                                        />
                                                                    ) : (
                                                                        <div className="flex items-center gap-1">
                                                                            <input 
                                                                                type="number"
                                                                                step="0.1"
                                                                                value={tier.rate}
                                                                                onChange={(e) => {
                                                                                    const newStds = [...standards];
                                                                                const next = parseFloat(e.target.value);
                                                                                if (!Number.isFinite(next)) return;
                                                                                newStds[sIdx].tiers[tIdx].rate = Math.max(0, next);
                                                                                setStandards(newStds);
                                                                            }}
                                                                                className="w-16 bg-transparent border-b border-blue-200 focus:border-blue-500 outline-none px-1 text-blue-600 font-bold"
                                                                            />
                                                                            <span className="text-blue-600 font-bold">‰</span>
                                                                        </div>
                                                                    )}
                                                                </td>
                                                                <td className="py-4 text-gray-400 italic">
                                                                    {tier.limit === Infinity 
                                                                        ? `基数 ${getTierBase(std, tIdx)} + 超额部分（基数=前档固定额合计）` 
                                                                        : '固定收费'}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <footer className="pt-10 flex justify-center">
                                    <button 
                                        onClick={() => setView('calc')}
                                        className="iso-button px-12"
                                    >
                                        保存并返回计算
                                    </button>
                                </footer>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
